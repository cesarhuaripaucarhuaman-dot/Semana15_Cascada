<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesto 3 - Tarjeta con Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-4">

    <!-- Tarjeta construida con componentes de Bootstrap (sesión 14) -->
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="width: 100%; max-width: 24rem;">
        <div style="height: 10rem; background: linear-gradient(135deg, #06b6d4, #155e75);"></div>
        <div class="card-body p-4">
            <h5 class="card-title fw-bold mb-1">Zapatillas Run</h5>
            <p class="card-text text-secondary mb-3">Ligeras y cómodas</p>
            <div class="d-flex align-items-center justify-content-between">
                <span class="fs-4 fw-bold text-info-emphasis">S/ 199</span>
                <button class="btn btn-primary fw-semibold px-4">Comprar</button>
            </div>
        </div>
    </div>

</body>
</html>
