<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesto 3 - Tarjeta con Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- La misma tarjeta, solo con utilidades de Tailwind -->
    <article class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="h-40 bg-gradient-to-br from-cyan-500 to-cyan-800"></div>
        <div class="p-6">
            <h2 class="text-xl font-bold text-slate-900 mb-1">Zapatillas Run</h2>
            <p class="text-slate-500 mb-4">Ligeras y cómodas</p>
            <div class="flex items-center justify-between">
                <span class="text-2xl font-bold text-cyan-800">S/ 199</span>
                <button class="bg-cyan-700 text-white font-semibold px-5 py-2 rounded-lg hover:bg-cyan-800 active:scale-95 transition">
                    Comprar
                </button>
            </div>
        </div>
    </article>

</body>
</html>
