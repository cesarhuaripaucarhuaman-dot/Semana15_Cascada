<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Catálogo con Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100">

    <header class="bg-teal-700 text-white">
        <nav class="max-w-6xl mx-auto flex items-center justify-between px-4 py-4">
            <a href="#" class="text-xl font-bold">Mi Tienda</a>
            <ul class="flex gap-4 text-sm sm:text-base">
                <li><a href="#" class="hover:underline">Inicio</a></li>
                <li><a href="#" class="hover:underline">Productos</a></li>
                <li class="hidden sm:block"><a href="#" class="hover:underline">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <h1 class="text-3xl md:text-4xl font-bold text-center mb-8">Catálogo</h1>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <article class="bg-white dark:bg-slate-800 rounded-xl shadow p-6 hover:shadow-xl hover:-translate-y-1 transition">
                <h2 class="text-xl font-semibold mb-2">Producto 1</h2>
                <p class="text-slate-600 dark:text-slate-300 mb-4">Descripción breve del producto.</p>
                <a href="#" class="inline-block bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-400">
                    Ver más
                </a>
            </article>

            <article class="bg-white dark:bg-slate-800 rounded-xl shadow p-6 hover:shadow-xl hover:-translate-y-1 transition">
                <h2 class="text-xl font-semibold mb-2">Producto 2</h2>
                <p class="text-slate-600 dark:text-slate-300 mb-4">Descripción breve del producto.</p>
                <a href="#" class="inline-block bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-400">
                    Ver más
                </a>
            </article>

            <article class="bg-white dark:bg-slate-800 rounded-xl shadow p-6 hover:shadow-xl hover:-translate-y-1 transition">
                <h2 class="text-xl font-semibold mb-2">Producto 3</h2>
                <p class="text-slate-600 dark:text-slate-300 mb-4">Descripción breve del producto.</p>
                <a href="#" class="inline-block bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-400">
                    Ver más
                </a>
            </article>

        </section>
    </main>

    <footer class="bg-slate-800 text-slate-300 text-center py-4">
        Mi Tienda — Hojas de Estilo en Cascada Avanzado
    </footer>

</body>
</html>
