<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesto 2 - Formulario de contacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6 sm:p-10">
        <header class="mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Contáctanos</h1>
            <p class="text-slate-500 mt-2">Completa el formulario y responderemos en menos de 24 horas.</p>
        </header>

        <form class="grid grid-cols-1 gap-5" novalidate>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-2">Nombre</label>
                    <input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Ana Torres"
                           class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 placeholder:text-slate-400 bg-white transition focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>

                <div>
                    <label for="correo" class="block text-sm font-semibold text-slate-700 mb-2">Correo</label>
                    <input id="correo" name="correo" type="email" autocomplete="email" placeholder="ana@correo.com"
                           class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 placeholder:text-slate-400 bg-white transition focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>

            <div>
                <label for="asunto" class="block text-sm font-semibold text-slate-700 mb-2">Asunto</label>
                <select id="asunto" name="asunto"
                        class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 bg-white transition focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                    <option value="">Selecciona una opción</option>
                    <option value="cotizacion">Cotización</option>
                    <option value="soporte">Soporte técnico</option>
                    <option value="otros">Otros</option>
                </select>
            </div>

            <div>
                <label for="mensaje" class="block text-sm font-semibold text-slate-700 mb-2">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..."
                          class="w-full border border-slate-300 rounded-lg p-3 text-slate-800 placeholder:text-slate-400 bg-white resize-y transition focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"></textarea>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-2">
                <p class="text-xs text-slate-500">Los campos tienen borde, relleno y anillo de color al enfocarse (focus:ring-2).</p>
                <button type="submit"
                        class="bg-sky-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-400/50 active:scale-95 transition">
                    Enviar mensaje
                </button>
            </div>

        </form>
    </main>

</body>
</html>
